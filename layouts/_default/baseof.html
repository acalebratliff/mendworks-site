<!doctype html>
<html lang="en-GB">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{{ partial "header.html" . }}
<main id="main" tabindex="-1">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
<!--
  Cloudflare Web Analytics (cookieless). Approved by the owner and off for now.
  To enable it, the owner creates the site in the Cloudflare dashboard,
  then replaces TOKEN below with the site token and uncomments this tag.
  It is the only script the site may load. (Go templates drop HTML comments,
  so this note never reaches the built pages. The CI "no JavaScript" step
  must then be updated to allow this one script.)
<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "TOKEN"}'></script>
-->
</body>
</html>
