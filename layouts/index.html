{{ define "main" }}
<div class="wrap">
  <section class="hero" aria-labelledby="mission-title">
    <p class="kicker">Mendworks · free and open-source tools</p>
    <h1 id="mission-title" class="visually-hidden">Mendworks</h1>
    <figure class="mission">
      <blockquote><p>“{{ .Params.mission }}”</p></blockquote>
      <figcaption>{{ site.Params.accountable }}</figcaption>
    </figure>
  </section>
  <div class="prose">
    {{ .Content }}
  </div>
</div>
{{ end }}
