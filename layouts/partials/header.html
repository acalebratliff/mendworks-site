<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>Mend<span>works</span></a>
    <nav aria-label="Main">
      <ul>
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ $state := "" }}
        {{ with .Page }}
          {{ if eq $current . }}{{ $state = "page" }}{{ else if $current.IsDescendant . }}{{ $state = "true" }}{{ end }}
        {{ end }}
        <li><a href="{{ .URL }}"{{ with $state }} aria-current="{{ . }}"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
      </ul>
    </nav>
  </div>
</header>
