# "What we didn't build" entries. One entry per declined candidate (or per hunt closed with no candidate).
# Fields:
#   order:     integer, higher shows first. Use the next number up for a new entry.
#   date:      YYYY-MM-DD the decision was made
#   hunt:      hunt number
#   candidate: what we looked at (describe AI app factories generically; never name them)
#   reason:    one or two sentences, respectful to every maintainer and project (Markdown allowed)
#   label:     measured | documented | inferred
#              measured   = we saw it ourselves in an API, a repo or a test
#              documented = stated in a policy, source file, issue or maintainer comment
#              inferred   = our own reasoning
#   evidence:  Markdown link(s) to public evidence, or a plain statement of where the evidence lives
entries:
  - order: 1
    date: "2026-10-03"
    hunt: 2
    candidate: "XSD/WSDL and JSON Schema diagrams (JetBrains plugin)"
    reason: "The existing plugin comes from a solo developer at a fair price. Our fairness rule says we never undercut an honest living, so we stopped."
    label: documented
    evidence: "the developer's own listing and site notice, checked by our red team. We don't link it, so as not to single the developer out."
  - order: 2
    date: "2026-10-03"
    hunt: 2
    candidate: "JMeter test-plan viewer (JetBrains plugin)"
    reason: "The viewer already opens files without a licence, its source is open, and it comes from a one-person shop at a small price. There was nothing to free, and our fairness rule applies too."
    label: documented
    evidence: "the developer's listing and the plugin's published source code, checked by our red team. We don't link it, so as not to single the developer out."
  - order: 3
    date: "2026-10-03"
    hunt: 2
    candidate: "Outlook PST archive viewer (new app)"
    reason: "We tested the free, MIT-licensed pst-viewer before deciding. It opened 5.6 GB and 9.4 GB archives and recovered 5 of 6 damaged files. The main gap we found was bulk export, and we added it to pst-viewer: [our contribution](/contributions/pst-viewer-31/)."
    label: measured
    evidence: "our runtime test; the project is [bod09/pst-viewer](https://github.com/bod09/pst-viewer)."
  - order: 4
    date: "2026-10-03"
    hunt: 2
    candidate: "Dev Containers for VS Code-compatible editors (Open VSX)"
    reason: "Four free newcomers arrived in ten months, and one already supports Docker Compose. The gap had closed."
    label: measured
    evidence: "Open VSX listings and download counts, measured by our red team on 2026-10-03."
  - order: 5
    date: "2026-10-03"
    hunt: 3
    candidate: "Whole hunt: shutdown rescues and hardware freed from the cloud"
    reason: "We screened 43 candidates and none met all seven of our tests. What remained had small user bases and no store where newcomers find them."
    label: measured
    evidence: "our internal candidate list, and install counts from Home Assistant analytics, 2026-10-03."
  - order: 6
    date: "2026-10-03"
    hunt: 4
    candidate: "Whole hunt: packaging missing Linux apps for Flathub"
    reason: "Flathub doesn't accept AI-written manifests or AI-opened submissions. Our work is done by AI agents, so we can't honestly package there, however good the candidates."
    label: documented
    evidence: "[Flathub's Generative AI policy](https://docs.flathub.org/docs/for-app-authors/requirements#generative-ai-policy)."
  - order: 8
    date: "2026-10-03"
    hunt: 7
    candidate: "Signature editor for Thunderbird for Android (#8841)"
    reason: "HTML signature support, the core of #8841, was merged on 2026-08-20 from an outside contributor."
    label: measured
    evidence: "[thunderbird-android pull request #10876](https://github.com/thunderbird/thunderbird-android/pull/10876)."
  - order: 9
    date: "2026-10-03"
    hunt: 7
    candidate: "Running more than one Joplin profile at once (#591)"
    reason: "Already shipped: Joplin Desktop runs two instances at once, each with its own profile and settings."
    label: documented
    evidence: "[Joplin's multiple-instances documentation](https://github.com/laurent22/joplin/blob/dev/readme/apps/multiple_instances.md)."
  - order: 10
    date: "2026-10-03"
    hunt: 8
    candidate: "Fixes for ScubaGear (Microsoft 365 security baselines)"
    reason: "A maintainer closed an outside fix because its issue wasn't in the current milestone, and the issues we looked at weren't in one either, so we stepped back."
    label: documented
    evidence: "[a maintainer closing an outside fix for that reason, #2399](https://github.com/cisagov/ScubaGear/pull/2399)."
  - order: 12
    date: "2026-10-03"
    hunt: 9
    candidate: "Absolute lighten and darken for the color npm package (#53)"
    reason: "The issue dates from 2015, and in 2021 the owner said the library's API had grown too much. Adding to it now wouldn't be welcome help."
    label: documented
    evidence: "[the owner's 2021 comment](https://github.com/Qix-/color/issues/53#issuecomment-849860888)."
  - order: 13
    date: "2026-10-03"
    hunt: 9
    candidate: "Custom sync server for Readest (#1168)"
    reason: "Readest's maintainer said in May 2025 that this feature would be part of the paid plan. Readest is independent work, so under our fairness rule it isn't ours to give away."
    label: documented
    evidence: "[the maintainer's comment on #1168](https://github.com/readest/readest/issues/1168#issuecomment-2888088288)."
  - order: 14
    date: "2026-10-03"
    hunt: 10
    candidate: "A maintained Code Runner for Open VSX"
    reason: "The owner is still active, an AI app factory published a look-alike copy the day we looked, and other same-pitch copies already exist. One more fork would help nobody."
    label: measured
    evidence: "[the Code Runner repository](https://github.com/formulahendry/vscode-code-runner) and Open VSX search results, 2026-10-03."
  - order: 15
    date: "2026-10-03"
    hunt: 10
    candidate: "A maintained autoDocstring for Open VSX"
    reason: "Four newcomers with the same pitch have appeared since May. The gap is already filled several times over."
    label: measured
    evidence: "[the autoDocstring repository](https://github.com/NilsJPWerner/autoDocstring) and Open VSX search results, 2026-10-03."
  - order: 16
    date: "2026-10-03"
    hunt: 10
    candidate: "A maintained PlantUML extension for Open VSX"
    reason: "A maintained, MIT-licensed extension already covers PlantUML preview and export there."
    label: measured
    evidence: "[PlantUML Markdown Preview on Open VSX](https://open-vsx.org/extension/yss-tazawa/plantuml-markdown-preview)."
  - order: 18
    date: "2026-10-03"
    hunt: 11
    candidate: "Fixes for oxidized (network configuration backup)"
    reason: "Oxidized's maintainers ask contributors to understand, test and stand behind every change. We don't run oxidized ourselves, so we couldn't stand behind fixes the way they ask, and stepped back."
    label: documented
    evidence: "[oxidized's guidance on AI coding agents](https://github.com/ytti/oxidized/blob/master/CONTRIBUTING.md#using-ai-coding-agents)."
  - order: 19
    date: "2026-10-06"
    hunt: 14
    candidate: "Whole hunt: export paywalls in popular apps"
    reason: "We looked at 25 paid export features from 24 vendors. Most lock data that lives in the vendor's cloud, where no free local tool can reach it. Two passed our screen, both with little sign of demand, so we closed the hunt."
    label: documented
    evidence: "our internal candidate list, with each vendor's own pricing or help page, checked 2026-10-06."
  - order: 20
    date: "2026-10-07"
    hunt: 17
    candidate: "Eye-gaze pointer control with a laptop webcam"
    reason: "In our own test, webcam eye gaze was off by 6.9 to 7.6 degrees, too coarse to aim a pointer. Head movement worked well on the same camera, so we turned to a head pointer instead."
    label: measured
    evidence: "our on-device test on 2026-10-07, run with the network cut off. The results are in our internal research notes."
  - order: 21
    date: "2026-10-07"
    hunt: 17
    candidate: "Linux mouse output for opentrack (head tracking)"
    reason: "In 2022 the maintainer declined mouse output on Linux as not a priority, citing drift and range issues. Nothing since points the other way, so we took that as the answer."
    label: documented
    evidence: "[the maintainer's comment on #1560](https://github.com/opentrack/opentrack/issues/1560#issuecomment-1293375453)."
  - order: 22
    date: "2026-10-07"
    hunt: 17
    candidate: "Taking over eViacam (webcam head mouse)"
    reason: "eViacam runs on X11 only. Its last release was in 2019 and its last change in 2022. Bringing it to Wayland would mean rewriting how it moves the pointer, with no active maintainer to work with."
    label: documented
    evidence: "[the eViacam repository](https://github.com/cmauri/eviacam), checked 2026-10-07."
  - order: 23
    date: "2026-10-07"
    hunt: 18
    candidate: "Soundscape in the browser (#75)"
    reason: "A community member already has a working browser version, started in 2024. People without an iPhone can also use the free Soundscape for Android from Scottish Tech Army."
    label: documented
    evidence: "[the browser version's announcement on #75](https://github.com/soundscape-community/soundscape/issues/75#issuecomment-1877117914) and [Soundscape for Android](https://github.com/Scottish-Tech-Army/Soundscape-Android)."
  - order: 24
    date: "2026-10-07"
    hunt: 18
    candidate: "Dwell and switch input for Dasher on the web"
    reason: "Dasher's web build calls itself a demo and points daily users to the desktop and mobile apps. Those apps are free on every major platform, so there was nothing to free."
    label: documented
    evidence: "[the dasher-web README](https://github.com/dasher-project/dasher-web) and [Dasher's downloads page](https://dasher.at/downloads/)."
  - order: 25
    date: "2026-10-07"
    hunt: 18
    candidate: "A new on-screen keyboard for GNOME on Wayland"
    reason: "Onboard already fills this need. It shipped five releases in 2026 and added Wayland support, including GNOME."
    label: measured
    evidence: "[Onboard's releases](https://github.com/onboard-osk/onboard/releases) and [its Wayland notes](https://github.com/onboard-osk/onboard/blob/main/README.WAYLAND.md)."
